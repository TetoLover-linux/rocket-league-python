name: Build Kivy APK

on:
  # push:
  #  branches: [ main, master ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' # Versión estable y compatible con Buildozer y jnius

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3
      with:
        # Instalamos las herramientas necesarias para compilar con Buildozer
        packages: 'platform-tools build-tools;33.0.0 platforms;android-33 ndk;25.2.9519653'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev

    - name: Instalar Buildozer y Cython
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Compilar APK con Buildozer
      run: |
        # El comando por defecto es 'android debug', que genera un APK de depuración
        buildozer -v android debug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: kivy-apk
        # Buildozer coloca el APK en el directorio 'bin' del proyecto
        path: bin/*.apk
        # Opcional: retención en días
        retention-days: 30
